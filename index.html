<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF to Image | High-End Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --primary-border: #1e1b4b;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card: #ffffff;
            --border-soft: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        
        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border-radius: 40px;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.15);
            padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.4rem; font-weight: 900; letter-spacing: -1.5px; color: var(--text-main); margin-bottom: 10px; }
        header p { color: var(--text-muted); font-size: 1rem; font-weight: 500; }

        /* 드롭존: 더 깔끔한 뉴모피즘 느낌 */
        #drop-zone {
            border: 2px dashed #cbd5e1;
            background: #fdfdfd;
            border-radius: 30px;
            padding: 45px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #drop-zone:hover { border-color: var(--primary); background: #f5f7ff; transform: translateY(-2px); }
        #drop-zone.dragover { border-color: var(--primary); background: #eff6ff; transform: scale(1.02); }

        .upload-icon { font-size: 50px; margin-bottom: 15px; display: block; filter: grayscale(0.2); }
        #file-label { font-size: 1.05rem; color: var(--text-muted); font-weight: 600; }
        .file-info { margin-top: 15px; font-weight: 800; color: var(--primary); font-size: 1.1rem; }

        /* [세련된 품질 설정 섹션] */
        .settings-card {
            background: #f8fafc;
            border-radius: 28px;
            padding: 30px;
            margin: 30px 0;
            border: 2px solid #f1f5f9;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.03), 0 10px 20px -10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .setting-group label {
            display: block;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 18px;
            letter-spacing: -0.5px;
        }

        .custom-select-wrapper {
            position: relative;
            width: 100%;
        }

        .custom-select {
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            border: 2px solid #cbd5e1;
            background: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            text-align: center;
            text-align-last: center;
            appearance: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .custom-select:hover { border-color: var(--primary); transform: translateY(-1px); }
        .custom-select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15); }

        /* 변환 버튼: 강력한 존재감 */
        #convertBtn {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: 3px solid var(--primary-border); 
            padding: 24px;
            border-radius: 22px;
            font-size: 1.4rem; 
            font-weight: 900;   
            letter-spacing: -0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3); 
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px -12px rgba(79, 70, 229, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        #convertBtn:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-5px); 
            box-shadow: 0 30px 50px -15px rgba(79, 70, 229, 0.6);
        }

        #convertBtn:disabled {
            background: #e2e8f0;
            border-color: #cbd5e1;
            color: #94a3b8;
            text-shadow: none;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #status { 
            margin-top: 30px; 
            text-align: center; 
            font-size: 1.1rem; 
            font-weight: 700; 
            color: var(--primary);
            letter-spacing: -0.3px;
        }

        /* 미리보기 카드 */
        #preview-area {
            margin-top: 45px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 20px;
        }
        .preview-card {
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--border-soft);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }
        .preview-card:hover { transform: scale(1.05); }
        .preview-card img { width: 100%; height: auto; display: block; }

        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .app-container { padding: 40px 25px; border-radius: 0; }
            body { padding: 0; background: #ffffff; }
            #convertBtn { font-size: 1.2rem; padding: 20px; }
        }
    </style>
</head>
<body oncontextmenu="return false">

<div class="app-container">
    <header>
        <h1>PDF to Image</h1>
        <p>프로페셔널 고화질 변환 엔진</p>
    </header>

    <div id="drop-zone" onclick="document.getElementById('pdfInput').click()">
        <span class="upload-icon">📄✨</span>
        <p id="file-label">PDF 파일을 이곳에 놓아주세요</p>
        <div id="file-info" class="file-info"></div>
        <input type="file" id="pdfInput" accept="application/pdf" style="display: none;">
    </div>

    <div class="settings-card">
        <div class="setting-group">
            <label>⚙️ 출력 이미지 품질 설정</label>
            <div class="custom-select-wrapper">
                <select id="dpi-select" class="custom-select">
                    <option value="72">72 DPI (Standard)</option>
                    <option value="150">150 DPI (High Quality)</option>
                    <option value="300" selected>300 DPI (Ultra HD - 추천)</option>
                    <option value="600">600 DPI (Maximum Detail)</option>
                </select>
            </div>
        </div>
    </div>

    <button id="convertBtn" onclick="processPDF()" disabled>
        <span>🚀</span> 이미지 변환 시작하기
    </button>
    
    <div id="status"></div>

    <div id="preview-area"></div>
    
    <footer>
        &copy; 2026 PDF2Image All rights reserved.
    </footer>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfData = null;
    let fileName = "converted";

    const pdfInput = document.getElementById('pdfInput');
    const dropZone = document.getElementById('drop-zone');
    const convertBtn = document.getElementById('convertBtn');
    const status = document.getElementById('status');
    const fileInfo = document.getElementById('file-info');
    const fileLabel = document.getElementById('file-label');

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    pdfInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

    function handleFile(file) {
        if (file.type !== 'application/pdf') {
            alert('PDF 파일만 선택 가능합니다.');
            return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
            pdfData = new Uint8Array(e.target.result);
            fileName = file.name.replace(/\.[^/.]+$/, "");
            fileLabel.innerText = "파일 준비 완료";
            fileInfo.innerText = `📄 ${file.name}`;
            convertBtn.disabled = false;
        };
        reader.readAsArrayBuffer(file);
    }

    async function processPDF() {
        const dpiValue = document.getElementById('dpi-select').value;
        const scale = parseInt(dpiValue) / 72;
        
        convertBtn.disabled = true;
        status.innerHTML = "⏳ 엔진 가동 중...";
        const previewArea = document.getElementById('preview-area');
        previewArea.innerHTML = '';

        try {
            const pdf = await pdfjsLib.getDocument({data: pdfData}).promise;
            const zip = new JSZip();
            
            for (let i = 1; i <= pdf.numPages; i++) {
                status.innerText = `🖼️ 렌더링 중: ${i} / ${pdf.numPages} 페이지`;
                
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: scale });
                
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: context, viewport: viewport }).promise;
                
                const dataUrl = canvas.toDataURL('image/png');
                const pageNum = String(i).padStart(3, '0');
                zip.file(`${fileName}_${pageNum}.png`, dataUrl.split(',')[1], {base64: true});

                const div = document.createElement('div');
                div.className = 'preview-card';
                const img = document.createElement('img');
                img.src = dataUrl;
                div.appendChild(img);
                previewArea.appendChild(div);
            }

            status.innerText = "📦 최종 파일 압축 중...";
            const content = await zip.generateAsync({type: "blob"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `${fileName}_images.zip`;
            link.click();
            
            status.innerText = "✅ 변환 완료! ZIP 파일이 저장되었습니다.";
        } catch (err) {
            console.error(err);
            status.innerText = "❌ 처리 중 오류가 발생했습니다.";
        } finally {
            convertBtn.disabled = false;
        }
    }
</script>

</body>
</html>
